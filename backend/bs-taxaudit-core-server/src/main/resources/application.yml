spring:
  application:
    name: bs-taxaudit-core-server

  profiles:
    active: mock

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:itas_audit}
    username: ${DB_USER:itas_dev}
    password: ${DB_PASSWORD:dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # IMPORTANT: Flyway manages schema. Never use 'update' or 'create' in non-dev profiles.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: false
    out-of-order: true
    clean-disabled: false
    clean-on-validation-error: true

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak issuer URI. Set KEYCLOAK_URL env var in production.
          # In mock profile, this config is bypassed entirely by MockSecurityConfig.
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8081}/realms/itas

server:
  port: 8080

logging:
  level:
    root: INFO
    mor.itas: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

---
# ── MOCK PROFILE (local development without Keycloak) ───────────────────────
spring:
  config:
    activate:
      on-profile: mock
  jpa:
    hibernate:
      # Allow schema auto-update in mock mode so new JPA entities are picked up without a migration
      ddl-auto: update

---
# ── PRODUCTION PROFILE ───────────────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    out-of-order: false
logging:
  level:
    root: WARN
    mor.itas: INFO
    org.springframework.security: WARN
